<!DOCTYPE html>
<html lang="mn">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Tegri CRM</title>
<style>
:root{--bg:#f3f5f7;--card:#fff;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--accent:#00bfea;--accent-ink:#007a99;--dark:#0b0f14;--red:#b91c1c;--red-bg:#fee2e2;--amber:#92400e;--amber-bg:#fef3c7}
*{box-sizing:border-box}
html,body{overflow-x:hidden;-webkit-text-size-adjust:100%;text-size-adjust:100%}
input,select,textarea{font-size:16px!important}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:5;background:var(--dark);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px}
.brand{font-weight:800;letter-spacing:.14em;font-size:16px}
.brand span{color:var(--accent);margin-left:6px}
.me{margin-left:auto;font-size:13px;color:#94a3b8}
.banner{display:none;background:var(--amber-bg);color:var(--amber);font-size:13px;padding:8px 16px;text-align:center}
.wrap{max-width:1100px;margin:0 auto;padding:12px 16px 0}
.search{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font-size:16px;background:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-size:13px;cursor:pointer;white-space:nowrap;color:var(--ink)}
.chip.on{background:var(--dark);color:#fff;border-color:var(--dark)}
.chip b{font-weight:600;margin-left:5px;opacity:.6}
.chip.q.on{background:var(--accent);border-color:var(--accent);color:#00222c}
main{max-width:1100px;margin:0 auto;padding:10px 16px 100px;display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-left:5px solid #cbd5e1;border-radius:12px;padding:12px 14px;cursor:pointer}
.card.i-Hot{border-left-color:#ef4444}
.card.i-Warm{border-left-color:#f59e0b}
.card.i-Cold{border-left-color:#94a3b8}
.tag{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;letter-spacing:.03em}
.tag.Hot{background:#fee2e2;color:#b91c1c}
.tag.Warm{background:#ffedd5;color:#c2410c}
.tag.Cold{background:#e5e7eb;color:#475569}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:10px 0;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:15px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button.on.Hot{background:#ef4444;border-color:#ef4444;color:#fff}
.seg button.on.Warm{background:#f59e0b;border-color:#f59e0b;color:#fff}
.seg button.on.Cold{background:#64748b;border-color:#64748b;color:#fff}
.hint{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.45}
.chip.hot.on{background:#ef4444;border-color:#ef4444;color:#fff}
.card:hover{border-color:var(--accent)}
.row{display:flex;align-items:center;gap:8px}
.name{font-weight:600}
.pill{font-size:12px;padding:3px 9px;border-radius:999px;background:#eef2f7;color:#334155;margin-left:auto;white-space:nowrap}
.meta{color:var(--muted);font-size:13px;margin-top:4px}
.next{font-size:13px;margin-top:8px;padding:6px 9px;border-radius:8px;background:#f1f5f9}
.next.over{background:var(--red-bg);color:var(--red)}
.next.today{background:var(--amber-bg);color:var(--amber)}
a.tel{color:var(--accent-ink);text-decoration:none;font-weight:500}
.fab{position:fixed;right:16px;bottom:20px;z-index:6;background:var(--accent);color:#00222c;border:0;border-radius:999px;padding:14px 20px;font-weight:700;font-size:15px;box-shadow:0 6px 20px rgba(0,0,0,.2);cursor:pointer}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:48px 0}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:10;align-items:flex-end;justify-content:center}
.overlay.open{display:flex}
.sheet{background:#fff;width:100%;max-width:640px;max-height:92vh;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;border-radius:16px 16px 0 0;padding:16px 16px 24px}
@media(min-width:700px){.overlay{align-items:center}.sheet{border-radius:16px}}
.sheet h2{margin:0 0 14px;font-size:18px;display:flex;align-items:center;gap:8px}
.x{margin-left:auto;background:none;border:0;font-size:26px;line-height:1;cursor:pointer;color:var(--muted)}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.grid>div{min-width:0}
.full{grid-column:1/-1}
input[type=date]{-webkit-appearance:none;appearance:none;min-width:0;max-width:100%;display:block;min-height:42px;text-align:left}
input[type=date]::-webkit-date-and-time-value{text-align:left}
label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px}
input,select,textarea{width:100%;max-width:100%;min-width:0;padding:10px;border:1px solid var(--line);border-radius:8px;font-size:16px;font-family:inherit;background:#fff;color:var(--ink)}
textarea{min-height:76px;resize:vertical}
.btn{background:var(--dark);color:#fff;border:0;border-radius:10px;padding:12px 16px;font-size:15px;font-weight:600;cursor:pointer;width:100%}
.btn.alt{background:#e2e8f0;color:var(--ink)}
.btn:disabled{opacity:.5}
.mt{margin-top:12px}
h3{font-size:14px;margin:22px 0 8px}
.log{border-left:2px solid var(--line);padding-left:12px}
.log div{margin-bottom:12px;font-size:14px;white-space:pre-wrap}
.log small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.log .sys{color:var(--muted)}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--dark);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;display:none;z-index:30;max-width:90vw}
.views{position:sticky;top:44px;z-index:4;background:var(--dark);display:flex;gap:4px;padding:0 12px 10px}
.views button{flex:1;max-width:160px;background:#1e293b;color:#cbd5e1;border:0;border-radius:8px;padding:9px 0;font-size:14px;font-weight:600;cursor:pointer}
.views button.on{background:var(--accent);color:#00222c}
.cat{max-width:1100px;margin:0 auto;padding:14px 16px 100px;display:none;gap:10px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.cat.show{display:grid}
.ccard{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;display:flex;gap:12px;align-items:center;padding:10px}
.ccard:hover{border-color:var(--accent)}
.ccard .th{width:96px;height:64px;flex:0 0 96px;border-radius:8px;background:#e2e8f0 center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:#94a3b8;font-size:11px;text-align:center;font-weight:700}
.ccard .th.logo{background-size:contain;background-color:#fff;border:1px solid var(--line)}
.ccard .t{min-width:0;flex:1}
.ccard .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.off{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:#e5e7eb;color:#475569}
.cat-note{grid-column:1/-1;font-size:13px;color:var(--muted);line-height:1.5}
.slot{border:1px dashed #cbd5e1;border-radius:10px;padding:10px;display:flex;gap:10px;align-items:center}
.slot .pv{width:110px;height:70px;flex:0 0 110px;border-radius:6px;background:#f1f5f9 center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:11px;color:#94a3b8;text-align:center;overflow:hidden;word-break:break-all;padding:4px}
.slot .pv.has{color:transparent}
.slot .pv.logo{background-size:contain}
.slot .info{min-width:0;flex:1;font-size:12px;color:var(--muted);line-height:1.4}
.slot .info b{display:block;color:var(--ink);font-size:13px;margin-bottom:2px}
.sbtn{display:inline-block;margin-top:6px;margin-right:6px;background:#e2e8f0;border:0;border-radius:7px;padding:7px 10px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink)}
.sbtn.rm{background:none;color:var(--red);padding:7px 4px}
.gal{display:grid;gap:8px}
.gi{display:flex;gap:8px;align-items:center}
.gi .pv{width:72px;height:48px;flex:0 0 72px;border-radius:6px;background:#f1f5f9 center/cover no-repeat}
.gi input{flex:1}
.ks{display:grid;grid-template-columns:minmax(0,1fr) 70px minmax(0,2fr);gap:6px;margin-bottom:6px}
.ks input{padding:8px}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink);margin:0}
.chk input{width:20px;height:20px;flex:0 0 20px}
.btn.del{background:none;color:var(--red);border:1px solid #fecaca;margin-top:10px}
.busy{opacity:.6;pointer-events:none}
.rule{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 28px;gap:6px;padding:8px 0;border-bottom:1px dashed var(--line);align-items:center}
.rule select,.rule input{padding:8px 6px}
.rule .ln{grid-column:1/-1;display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.rule .ln input{width:64px;flex:0 0 64px}
</style>
</head>
<body>
<header><div class="brand">TEGRI<span>CRM</span></div><div class="me" id="me"></div></header>
<nav class="views" id="views"><button class="on" data-v="leads">Лидүүд</button><button data-v="cars">Машинууд</button><button data-v="banks">Банкууд</button></nav>
<div class="banner" id="banner">Туршилтын горим — жишээ өгөгдөл. Өөрчлөлт хадгалагдахгүй.</div>
<div class="wrap">
  <input class="search" id="q" type="search" placeholder="Нэр, утас, загвараар хайх">
  <div class="chips" id="chips"></div>
  <div class="chips" id="quick"></div>
</div>
<main id="list"><div class="empty">Ачаалж байна…</div></main>
<section class="cat" id="cat"></section>
<button class="fab" id="add">+ Лид</button>
<div class="overlay" id="ov"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

function api(fn, ...args) {
  if (DEMO) return new Promise((res, rej) => setTimeout(() => {
    try { res(JSON.parse(JSON.stringify(Demo[fn](...args)))); } catch (e) { rej(e); }
  }, 120));
  return new Promise((res, rej) => google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](...args));
}

/* ---------- Жагсаалт ---------- */
const isOpen = l => S.closed.indexOf(l.status) < 0;
const isDue = l => isOpen(l) && l.actionDate && l.actionDate <= today();

function fmtDay(s) {
  if (!s) return '';
  const t = today(), tm = new Date(); tm.setDate(tm.getDate() + 1);
  if (s === t) return 'Өнөөдөр';
  if (s === dstr(tm)) return 'Маргааш';
  return s.slice(5).replace('-', '.');
}

const inStatus = l => F.status === 'Идэвхтэй' ? isOpen(l) : l.status === F.status;

function renderChips() {
  const cnt = s => S.leads.filter(l => s === 'Идэвхтэй' ? isOpen(l) : l.status === s).length;
  $('#chips').innerHTML = ['Идэвхтэй'].concat(S.statuses).map(s =>
    `<button class="chip ${F.status === s ? 'on' : ''}" data-s="${esc(s)}">${esc(s)}<b>${cnt(s)}</b></button>`).join('');
  const mine = S.leads.filter(l => isOpen(l) && l.owner === S.me.name).length;
  const due = S.leads.filter(isDue).length;
  const ic = v => S.leads.filter(l => inStatus(l) && l.interest === v).length;
  $('#quick').innerHTML = [['', 'Бүх хүний'], ['mine', 'Миний', mine], ['due', 'Өнөөдөр хийх', due]].map(q =>
    `<button class="chip q ${F.quick === q[0] ? 'on' : ''}" data-q="${q[0]}">${q[1]}${q[2] != null ? '<b>' + q[2] + '</b>' : ''}</button>`).join('') +
    S.interests.map(v => `<button class="chip hot ${F.interest === v ? 'on' : ''}" data-i="${v}"><span class="tag ${v}">${v}</span><b>${ic(v)}</b></button>`).join('');
}

function visible() {
  const q = F.q.trim().toLowerCase();
  const v = S.leads.filter(l => {
    if (!inStatus(l)) return false;
    if (F.interest && l.interest !== F.interest) return false;
    if (F.quick === 'mine' && l.owner !== S.me.name) return false;
    if (F.quick === 'due' && !isDue(l)) return false;
    if (q && [l.name, l.phone, l.email, l.model, l.id].join(' ').toLowerCase().indexOf(q) < 0) return false;
    return true;
  });
  return v.sort((a, b) => (irank(a.interest) - irank(b.interest)) || (F.quick === 'due'
    ? String(a.actionDate).localeCompare(String(b.actionDate))
    : String(b.created).localeCompare(String(a.created))));
}

function card(l) {
  const t = today();
  let next = '';
  if (l.nextAction || l.actionDate) {
    const cls = isOpen(l) && l.actionDate ? (l.actionDate < t ? 'over' : l.actionDate === t ? 'today' : '') : '';
    next = `<div class="next ${cls}">${esc(l.nextAction || 'Үйлдэл')}${l.actionDate ? ' · ' + esc(fmtDay(l.actionDate)) : ''}${cls === 'over' ? ' · хугацаа хэтэрсэн' : ''}</div>`;
  }
  const extra = [l.model, l.payment && l.payment !== 'Тодорхойгүй' ? l.payment : ''].filter(Boolean).map(esc).join(' · ');
  const iv = S.interests.indexOf(l.interest) >= 0 ? l.interest : '';
  return `<div class="card ${iv ? 'i-' + iv : ''}" data-id="${esc(l.id)}">
    <div class="row"><span class="name">${l.name ? esc(l.name) : '<span style="color:var(--muted)">Нэргүй</span>'}</span>${iv ? `<span class="tag ${iv}">${iv}</span>` : ''}<span class="pill" style="background:${STATUS_COLOR[l.status] || '#eef2f7'}">${esc(l.status)}</span></div>
    <div class="meta"><a class="tel" href="tel:${esc(l.phone)}">${esc(l.phone)}</a>${extra ? ' · ' + extra : ''}</div>
    <div class="meta">${esc(l.source)} · ${l.owner ? esc(l.owner) : '<span style="color:var(--red)">хариуцагчгүй</span>'}${l.status === 'Алдсан' && l.lostReason ? ' · ' + esc(l.lostReason) : ''}</div>
    ${next}</div>`;
}

function renderList() {
  const v = visible();
  $('#list').innerHTML = v.length ? v.map(card).join('') : '<div class="empty">Энд лид алга</div>';
}
function rerender() { renderChips(); renderList(); }

      <div><label>Төлбөр</label><select id="f_payment">${opt(S.payments, l.payment)}</select></div>
      <div><label>Эх сурвалж</label><select id="f_source">${opt(S.sources, l.source)}</select></div>

      <div><label>Дараагийн үйлдэл</label><select id="f_nextAction">${opt(S.actions, l.nextAction, true)}</select></div>

    ${id ? `<h3>Тэмдэглэл нэмэх</h3>
      <textarea id="note" placeholder="Юу ярилцсан, хэрэглэгч юу хүссэн…"></textarea>
      <button class="btn alt mt" id="noteBtn" onclick="addNote()">Тэмдэглэл нэмэх</button>
      <h3>Түүх</h3><div class="log" id="log"><div class="sys">Ачаалж байна…</div></div>` : ''}`;
  toggleLost();
  $('#f_interest').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    const seg = $('#f_interest'), v = seg.dataset.v === b.dataset.v ? '' : b.dataset.v;
    seg.dataset.v = v;
    seg.querySelectorAll('button').forEach(x => x.classList.toggle('on', x.dataset.v === v));
  });
  $('#ov').classList.add('open');
  if (id) loadLog(id);

function toggleLost() { $('#lostWrap').style.display = $('#f_status').value === 'Алдсан' ? '' : 'none'; }
function closeSheet() { $('#ov').classList.remove('open'); cur = null; curItem = null; }

async function save() {
  const g = k => $('#f_' + k).value.trim();
  const o = { id: cur, name: g('name'), phone: g('phone'), email: g('email'), source: g('source'), model: g('model'),
    payment: g('payment'), status: g('status'), owner: g('owner'), nextAction: g('nextAction'), actionDate: g('actionDate'),
    lostReason: g('status') === 'Алдсан' ? g('lostReason') : '', interest: $('#f_interest').dataset.v || '' };
  if (!o.phone) return toast('Утасны дугаар заавал бөглөнө');
  if (o.status === 'Алдсан' && !o.lostReason) return toast('Алдсан шалтгааныг бичнэ үү');
  const btn = $('#saveBtn'); btn.disabled = true;
  try {
    const saved = await api('apiSaveLead', o);
    const i = S.leads.findIndex(x => x.id === saved.id);
    if (i >= 0) S.leads[i] = saved; else S.leads.unshift(saved);
    rerender();
    toast('Хадгаллаа');
    if (!cur) openLead(saved.id); else { $('#ttl').textContent = saved.name || saved.phone; loadLog(saved.id); }
  } catch (e) { toast('Алдаа: ' + (e.message || e)); }
  finally { if ($('#saveBtn')) $('#saveBtn').disabled = false; }
}

async function loadLog(id) {
  try { renderLog(await api('apiGetLog', id)); }
  catch (e) { $('#log').innerHTML = '<div class="sys">Түүх ачаалж чадсангүй</div>'; }
}
function renderLog(items) {
  if (!$('#log')) return;
  $('#log').innerHTML = items.length ? items.map(x => `<div class="${x.type === 'Тэмдэглэл' ? '' : 'sys'}">${esc(x.text)}<small>${esc(x.who)} · ${esc(x.at)}${x.type !== 'Тэмдэглэл' ? ' · ' + esc(x.type) : ''}</small></div>`).join('')
    : '<div class="sys">Түүх алга</div>';
}
async function addNote() {
  const t = $('#note').value.trim();
  if (!t) return;
  const btn = $('#noteBtn'); btn.disabled = true;
  try { renderLog(await api('apiAddNote', cur, t)); $('#note').value = ''; toast('Тэмдэглэл нэмэгдлээ'); }
  catch (e) { toast('Алдаа: ' + (e.message || e)); }
  finally { btn.disabled = false; }
}

  const leads = v === 'leads';
  document.querySelector('.wrap').style.display = leads ? '' : 'none';
  $('#list').style.display = leads ? '' : 'none';
  $('#cat').classList.toggle('show', !leads);
  $('#add').textContent = leads ? '+ Лид' : v === 'cars' ? '+ Машин' : '+ Банк';
  if (!leads) loadCatalog();
  window.scrollTo(0, 0);
}
async function loadCatalog() {
  if (!CAT) $('#cat').innerHTML = '<div class="empty">Ачаалж байна…</div>';
  try { CAT = await api('apiCatalog'); renderCat(); }
  catch (e) { $('#cat').innerHTML = '<div class="empty">Ачаалж чадсангүй: ' + esc(e.message || e) + '<br>setupCatalog() ажиллуулсан эсэхээ шалгана уу.</div>'; }
}
function renderCat() {
  if (!CAT || VIEW === 'leads') return;
  const off = x => x.visible ? '' : ' <span class="off">Нуусан</span>';
  if (VIEW === 'cars') {
    $('#cat').innerHTML = '<div class="cat-note">Энд засахад вэбсайт 5 минутын дотор шинэчлэгдэнэ. Эрэмбээр нь сайтад харагдана.</div>' +
      (CAT.cars.map(c => `<div class="ccard" data-id="${esc(c.id)}"><div class="th" style="${bg(c.cardImg || c.heroDesktop)}">${isUrl(c.cardImg || c.heroDesktop) ? '' : (c.cardImg || c.heroDesktop) ? 'Сайтын<br>зураг' : 'Зураг<br>алга'}</div>
        <div class="t"><div class="nm">${esc(c.name)}${off(c)}</div><div class="meta">${esc(money(c.price))}</div>
        <div class="meta">${esc(c.status)} · #${c.order}${c.featured ? ' · Баннерт' : ''}</div></div></div>`).join('') || '<div class="empty">Машин алга</div>');
  } else {
    $('#cat').innerHTML = '<div class="cat-note">Зээлийн тооцоолуурт харагдах банк, ББСБ. Хүү нь сарын хүү (%).</div>' +
      (CAT.banks.map(b => `<div class="ccard" data-id="${esc(b.id)}"><div class="th logo" style="${bg(b.logo)}">${isUrl(b.logo) ? '' : esc(b.mark || '')}</div>
        <div class="t"><div class="nm">${esc(b.name)}${off(b)}</div><div class="meta">${esc(b.type)} · ${rateRange(b)} / сар</div>
        <div class="meta">Урьдчилгаа ${b.downs.join(', ')}% · ${b.terms.join(', ')} сар</div></div></div>`).join('') || '<div class="empty">Банк алга</div>');
  }
}

function slot(key, url) {
  const m = IMG[key], has = !!url;
  return `<div class="slot" data-k="${key}"><div class="pv ${has && isUrl(url) ? 'has' : ''} ${m.png ? 'logo' : ''}" style="${bg(url)}">${has ? (isUrl(url) ? '' : esc(url)) : 'Зураггүй'}</div>
    <div class="info"><b>${m.t}</b>${m.s}<br><button type="button" class="sbtn" data-up="${key}">${has ? 'Солих' : 'Зураг оруулах'}</button>${has ? `<button type="button" class="sbtn rm" data-rm="${key}">Хасах</button>` : ''}</div>
    <input type="hidden" id="i_${key}" value="${esc(url || '')}"></div>`;
}
function galItem(g) {
  return `<div class="gi"><div class="pv" style="${bg(g.url)}"></div><input class="g-label" value="${esc(g.label || '')}" placeholder="Гарчиг (Гадна, Салон…)"><input type="hidden" class="g-url" value="${esc(g.url)}"><button type="button" class="sbtn rm" data-grm>×</button></div>`;
}
function ksRows(list) {
  let h = '';
  for (let i = 0; i < 4; i++) {
    const k = list[i] || {};
    h += `<div class="ks"><input class="k-v" value="${esc(k.value || '')}" placeholder="212"><input class="k-u" value="${esc(k.unit || '')}" placeholder="м.х"><input class="k-l" value="${esc(k.label || '')}" placeholder="Нийт хүч"></div>`;
  }
  return h;
}

function openCar(id) {
  const c = id ? CAT.cars.find(x => x.id === id) : { id: '', name: '', kind: '', tag: '', price: '', status: 'Бэлэн', visible: true, featured: true,

  $('#sheet').innerHTML = `
    <h2><span>${id ? esc(c.name) : 'Шинэ машин'}</span><button class="x" onclick="closeSheet()" aria-label="Хаах">×</button></h2>

      <div><label>Төрөл</label><input id="c_kind" value="${esc(c.kind)}" placeholder="Седан · Plug-in hybrid"></div>
      <div><label>Шүүлтүүрийн ангилал</label><input id="c_tag" list="taglist" value="${esc(c.tag)}"><datalist id="taglist">${tags.map(t => `<option value="${esc(t)}">`).join('')}</datalist></div>
      <div class="full"><label>Баннерын дээд мөр</label><input id="c_kicker" value="${esc(c.kicker)}"></div>
      <div class="full"><label>Тайлбар</label><input id="c_sub" value="${esc(c.sub)}"></div>
      <div><label>Эрэмбэ</label><input id="c_order" type="number" inputmode="numeric" value="${c.order}"></div>
      <div style="display:flex;flex-direction:column;justify-content:flex-end;gap:8px">
        <label class="chk"><input type="checkbox" id="c_visible" ${c.visible ? 'checked' : ''}> Сайтад харуулах</label>
        <label class="chk"><input type="checkbox" id="c_featured" ${c.featured ? 'checked' : ''}> Нүүрний баннерт</label></div>
    </div>
    <h3>Зураг</h3>
    <div class="gal">${slot('heroDesktop', c.heroDesktop)}${slot('heroMobile', c.heroMobile)}${slot('cardImg', c.cardImg)}</div>
    <h3>Дэлгэрэнгүй хуудасны цомог</h3>
    <div class="gal" id="gal">${c.gallery.map(galItem).join('')}</div>
    <button type="button" class="sbtn" id="galAdd">+ Зураг нэмэх</button> <span class="hint">1920×1200, нэг дор хэд хэдийг сонгож болно</span>
    <h3>Гол үзүүлэлт (4 хүртэл)</h3>
    <div class="hint" style="margin:-4px 0 8px">Утга · нэгж · тайлбар</div>${ksRows(c.keySpecs)}
    <h3>Техникийн үзүүлэлт</h3>
    <textarea id="c_specs" style="min-height:130px" placeholder="Хөдөлгүүр: 1.5 л бензин + цахилгаан мотор&#10;Батарей: 18.3 кВт·ц">${esc(c.specs.map(s => s.label + ': ' + s.value).join('\n'))}</textarea>
    <div class="hint">Мөр бүрт нэг: «Нэр: Утга»</div>
    <h3>Танилцуулга (PDF)</h3>
    <div class="slot"><div class="info"><b>${c.brochure ? '<a class="tel" href="' + esc(c.brochure) + '" target="_blank">PDF нээх</a>' : 'Оруулаагүй'}</b>
      <button type="button" class="sbtn" id="pdfUp">${c.brochure ? 'Солих' : 'PDF оруулах'}</button>${c.brochure ? '<button type="button" class="sbtn rm" id="pdfRm">Хасах</button>' : ''}</div>
      <input type="hidden" id="c_brochure" value="${esc(c.brochure)}"></div>
    <button class="btn mt" id="saveBtn" onclick="saveCar()">Хадгалах</button>
    ${id ? '<button class="btn del" id="delBtn" onclick="delItem(this)">Машиныг устгах</button>' : ''}`;
  $('#c_price').addEventListener('input', e => { const d = e.target.value.replace(/\D/g, ''); e.target.value = d ? Number(d).toLocaleString('en-US') : ''; });
  $('#galAdd').onclick = () => pick('image/*', true, async files => {
    for (const f of files) { const url = await upload(f, IMG.gallery); if (url) $('#gal').insertAdjacentHTML('beforeend', galItem({ label: '', url })); }
  });
  $('#pdfUp').onclick = () => pick('application/pdf', false, async files => {
    const url = await upload(files[0], null); if (url) { $('#c_brochure').value = url; refreshPdf(url); }

  if ($('#pdfRm')) $('#pdfRm').onclick = () => { $('#c_brochure').value = ''; refreshPdf(''); };

}
function refreshPdf(url) {
  const box = $('#c_brochure').parentElement.querySelector('.info b');
  box.innerHTML = url ? '<a class="tel" href="' + esc(url) + '" target="_blank">PDF нээх</a> · хадгалахаа мартуузай' : 'Оруулаагүй (хадгалахад хасагдана)';
}

const INC_OPTS = [['Бүгд', 'Бүх орлого'], ['Цалин', 'Цалин'], ['Бизнес', 'Бизнес']];
const CAR_OPTS = [['Бүгд', 'Бүх машин'], ['EV', 'EV'], ['PHEV', 'PHEV']];
const sel = (cls, opts, v) => `<select class="${cls}">${opts.map(o => `<option value="${o[0]}" ${o[0] === v ? 'selected' : ''}>${o[1]}</option>`).join('')}</select>`;
function ruleRow(r) {
  r = r || { inc: 'Бүгд', max: 96, car: 'Бүгд', rate: '', rateMax: '' };
  return `<div class="rule">${sel('r-inc', INC_OPTS, r.inc)}${sel('r-car', CAR_OPTS, r.car)}<button type="button" class="sbtn rm" data-rrm aria-label="Нөхцөл хасах">×</button>
    <div class="ln"><input class="r-max" inputmode="numeric" value="${esc(r.max)}" aria-label="Хэдэн сар хүртэл"> сар хүртэл · хүү <input class="r-rate" inputmode="decimal" value="${esc(r.rate)}" aria-label="Хүү"> – <input class="r-rmax" inputmode="decimal" value="${esc(r.rateMax || '')}" aria-label="Дээд хүү (заавал биш)"> %</div></div>`;
}
function collectRules() {
  return Array.from(document.querySelectorAll('#rules .rule')).map(x => ({
    inc: x.querySelector('.r-inc').value, max: Number(x.querySelector('.r-max').value) || 0, car: x.querySelector('.r-car').value,
    rate: Number(x.querySelector('.r-rate').value.replace(',', '.')) || 0, rateMax: Number(x.querySelector('.r-rmax').value.replace(',', '.')) || ''
  })).filter(r => r.rate > 0 && r.max > 0);
}
function rateRange(b) {
  const rs = (b.rules || []).reduce((a, r) => a.concat([r.rate, r.rateMax || r.rate]), []);
  if (!rs.length) return b.rate + '%';
  const lo = Math.min(...rs), hi = Math.max(...rs);
  return hi > lo ? lo + '–' + hi + '%' : lo + '%';
}

function openBank(id) {
  const b = id ? CAT.banks.find(x => x.id === id) : { id: '', name: '', mark: '', type: 'Автомашины зээл', rate: '', downs: [10, 20, 30], terms: [24, 36, 48, 60], notes: [], logo: '', visible: true,
    order: (CAT.banks.length ? Math.max(...CAT.banks.map(x => x.order)) : 0) + 1 };
  if (!b) return;
  curItem = b.id || null;
  $('#sheet').innerHTML = `
    <h2><span>${id ? esc(b.name) : 'Шинэ банк / ББСБ'}</span><button class="x" onclick="closeSheet()" aria-label="Хаах">×</button></h2>
    <div class="grid">
      <div class="full"><label>Нэр *</label><input id="b_name" value="${esc(b.name)}" placeholder="Хаан банк"></div>
      <div><label>Зээлийн төрөл</label><input id="b_type" value="${esc(b.type)}"></div>
      <div><label>Сарын хүү (%) — нөхцөлгүй үед</label><input id="b_rate" inputmode="decimal" value="${b.rate}" placeholder="1.25"></div>
      <div class="full"><label>Хүүгийн нөхцөл</label>
        <div class="hint" style="margin:0 0 6px">Нөхцөл бүрт орлогын төрөл, машин, хэдэн сар хүртэл, хүүг бичнэ. Хүү хязгаартай бол (1.3–1.6%) хоёр дахь нүдэнд дээд хүүг бичнэ. Аль ч нөхцөлд тохирохгүй хугацаа, машин сайтад гарахгүй.</div>
        <div id="rules">${(b.rules || []).map(ruleRow).join('')}</div>
        <button type="button" class="sbtn" id="ruleAdd">+ Нөхцөл нэмэх</button></div>
      <div class="full"><label>Урьдчилгааны сонголт (%) *</label><input id="b_downs" inputmode="numeric" value="${b.downs.join(', ')}" placeholder="10, 20, 30"></div>
      <div class="full"><label>Хугацааны сонголт (сар) *</label><input id="b_terms" inputmode="numeric" value="${b.terms.join(', ')}" placeholder="24, 36, 48, 60"></div>
      <div class="full"><label>Нөхцөл (мөр бүрт нэг)</label><textarea id="b_notes" placeholder="Цахилгаан ба хосолмол машинд&#10;Цалингийн зээлдэгчид хөнгөлөлттэй">${esc(b.notes.join('\n'))}</textarea></div>
      <div><label>Лого байхгүй үед харагдах үсэг</label><input id="b_mark" maxlength="3" value="${esc(b.mark)}"></div>
      <div><label>Эрэмбэ</label><input id="b_order" type="number" inputmode="numeric" value="${b.order}"></div>
      <div class="full"><label class="chk"><input type="checkbox" id="b_visible" ${b.visible ? 'checked' : ''}> Тооцоолуурт харуулах</label></div>
    </div>
    <h3>Лого</h3>${slot('logo', b.logo)}
    <button class="btn mt" id="saveBtn" onclick="saveBank()">Хадгалах</button>
    ${id ? '<button class="btn del" id="delBtn" onclick="delItem(this)">Устгах</button>' : ''}`;
  $('#ov').classList.add('open');
}

/* Файл сонгох, зураг багасгаж Drive руу илгээх */
function pick(accept, multiple, cb) {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = accept; inp.multiple = !!multiple;
  inp.onchange = () => { if (inp.files.length) cb(Array.from(inp.files)); };
  inp.click();
}
function readAs(file) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); }); }
async function shrink(file, m) {
  const src = await readAs(file);
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
  const k = Math.min(1, m.w / img.naturalWidth, m.h / img.naturalHeight);
  const w = Math.round(img.naturalWidth * k), h = Math.round(img.naturalHeight * k);
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const ctx = cv.getContext('2d');
  if (!m.png) { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); }
  ctx.drawImage(img, 0, 0, w, h);
  const mime = m.png ? 'image/png' : 'image/jpeg';
  return { mime, data: cv.toDataURL(mime, 0.85), w, h };
}
async function upload(file, m) {
  const sheet = $('#sheet');
  sheet.classList.add('busy'); toast('Оруулж байна… ' + file.name);
  try {
    let mime = file.type, data;
    if (m) { const r = await shrink(file, m); mime = r.mime; data = r.data; }
    else { if (file.size > 20 * 1024 * 1024) throw new Error('PDF 20 MB-аас их байна'); data = await readAs(file); }
    const name = file.name.replace(/\.[^.]+$/, '') + (mime === 'image/png' ? '.png' : mime === 'image/jpeg' ? '.jpg' : '.pdf');
    const url = await api('apiUpload', name, mime, data.split(',')[1]);
    toast('Орлоо — хадгалахаа мартуузай');
    return url;
  } catch (e) { toast('Алдаа: ' + (e.message || e)); return ''; }
  finally { sheet.classList.remove('busy'); }
}
function setSlot(key, url) {
  const old = document.querySelector(`.slot[data-k="${key}"]`);
  if (old) old.outerHTML = slot(key, url);
}

function collectCar() {
  const g = k => $('#c_' + k).value.trim();
  const specs = g('specs').split('\n').map(l => l.trim()).filter(Boolean).map(l => {
    const i = l.indexOf(':'); return i > 0 ? { label: l.slice(0, i).trim(), value: l.slice(i + 1).trim() } : { label: l, value: '' };
  });
  const ks = Array.from(document.querySelectorAll('.ks')).map(r => ({ value: r.querySelector('.k-v').value.trim(), unit: r.querySelector('.k-u').value.trim(), label: r.querySelector('.k-l').value.trim() })).filter(k => k.value || k.label);
  const gallery = Array.from(document.querySelectorAll('#gal .gi')).map(r => ({ label: r.querySelector('.g-label').value.trim(), url: r.querySelector('.g-url').value }));
  return { id: curItem || '', name: g('name'), price: g('price').replace(/\D/g, ''), status: g('status'), kind: g('kind'), tag: g('tag'),
    kicker: g('kicker'), sub: g('sub'), order: Number(g('order')) || 99, visible: $('#c_visible').checked, featured: $('#c_featured').checked,
    heroDesktop: $('#i_heroDesktop').value, heroMobile: $('#i_heroMobile').value, cardImg: $('#i_cardImg').value,
    gallery, keySpecs: ks, specs, brochure: $('#c_brochure').value, power: $('#c_power').value };
}
function collectBank() {
  const g = k => $('#b_' + k).value.trim();
  return { id: curItem || '', name: g('name'), type: g('type'), rate: Number(g('rate').replace(',', '.')) || 0, downs: g('downs'), terms: g('terms'), rules: collectRules(),
    notes: g('notes'), mark: g('mark') || g('name').slice(0, 1), order: Number(g('order')) || 99, visible: $('#b_visible').checked, logo: $('#i_logo').value };
}
async function saveCar() {
  const o = collectCar();
  if (!o.name) return toast('Машины нэрийг бичнэ үү');
  await persist('apiSaveCar', o, 'cars');
}
async function saveBank() {
  const o = collectBank();
  if (!o.name) return toast('Нэрийг бичнэ үү');
  if (!(o.rate > 0) && !o.rules.length) return toast('Сарын хүү эсвэл хүүгийн нөхцөл бичнэ үү');
  await persist('apiSaveBank', o, 'banks');
}
async function persist(fn, o, key) {
  const btn = $('#saveBtn'); btn.disabled = true;
  try { CAT[key] = await api(fn, o); renderCat(); closeSheet(); toast('Хадгаллаа — сайт 5 минутын дотор шинэчлэгдэнэ'); }
  catch (e) { toast('Алдаа: ' + (e.message || e)); }
  finally { if ($('#saveBtn')) $('#saveBtn').disabled = false; }
}
async function delItem(btn) {
  if (!btn.dataset.sure) { btn.dataset.sure = '1'; btn.textContent = 'Дахин дарж устгана уу'; return; }
  btn.disabled = true;
  const key = VIEW;
  try { CAT[key] = await api(key === 'cars' ? 'apiDeleteCar' : 'apiDeleteBank', curItem); renderCat(); closeSheet(); toast('Устгалаа'); }
  catch (e) { toast('Алдаа: ' + (e.message || e)); btn.disabled = false; }
}

$('#sheet').addEventListener('click', e => {
  const up = e.target.closest('[data-up]'), rm = e.target.closest('[data-rm]'), grm = e.target.closest('[data-grm]');
  if (up) { const k = up.dataset.up; pick(IMG[k].png ? 'image/png,image/jpeg,image/webp' : 'image/jpeg,image/png,image/webp', false, async f => { const url = await upload(f[0], IMG[k]); if (url) setSlot(k, url); }); }
  if (rm) setSlot(rm.dataset.rm, '');
  if (grm) grm.closest('.gi').remove();
  if (e.target.id === 'ruleAdd') $('#rules').insertAdjacentHTML('beforeend', ruleRow());
  const rrm = e.target.closest('[data-rrm]'); if (rrm) rrm.closest('.rule').remove();
});
$('#views').addEventListener('click', e => { const b = e.target.closest('button'); if (b && b.dataset.v !== VIEW) setView(b.dataset.v); });
$('#cat').addEventListener('click', e => { const c = e.target.closest('.ccard'); if (c) (VIEW === 'cars' ? openCar : openBank)(c.dataset.id); });

/* ---------- Эхлүүлэх ---------- */
async function refresh() {
  if ($('#ov').classList.contains('open') || VIEW !== 'leads') return;
  try { S.leads = await api('apiGetLeads'); rerender(); } catch (e) {}
}
async function init() {
  if (DEMO) $('#banner').style.display = 'block';
  try { S = await api('apiBootstrap'); }
  catch (e) { $('#list').innerHTML = '<div class="empty">Ачаалж чадсангүй: ' + esc(e.message || e) + '</div>'; return; }
  $('#me').textContent = S.me.name;
  rerender();
  setInterval(refresh, 60000);
}

$('#chips').addEventListener('click', e => { const c = e.target.closest('.chip'); if (c) { F.status = c.dataset.s; rerender(); } });
$('#quick').addEventListener('click', e => {
  const c = e.target.closest('.chip'); if (!c) return;
  if (c.dataset.i !== undefined) F.interest = F.interest === c.dataset.i ? '' : c.dataset.i;
  else F.quick = c.dataset.q;
  rerender();
});
$('#q').addEventListener('input', e => { F.q = e.target.value; renderList(); });
$('#list').addEventListener('click', e => { if (e.target.closest('a')) return; const c = e.target.closest('.card'); if (c) openLead(c.dataset.id); });
$('#add').addEventListener('click', () => VIEW === 'leads' ? openLead(null) : VIEW === 'cars' ? (CAT && openCar(null)) : (CAT && openBank(null)));
$('#ov').addEventListener('click', e => { if (e.target.id === 'ov') closeSheet(); });
init();
</script>
